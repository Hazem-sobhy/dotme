<!DOCTYPE html>
<html>

<head>
    <title>Test Email</title>
    <style>
        body {
            font-family: Arial;
            background: #111;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: #222;
            padding: 40px;
            border-radius: 12px;
            width: 350px;
        }

        input,
        button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border: none;
        }

        button {
            background: #4CAF50;
            color: white;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            padding: 10px;
            border-radius: 6px;
            display: none;
        }

        .success {
            background: #1e4620;
            color: #8bc34a;
        }

        .error {
            background: #461e1e;
            color: #ff6b6b;
        }
    </style>
</head>

<body>
    <div class="box">
        <h2>Test Email Configuration</h2>
        <input type="email" id="email" placeholder="Enter your email" value="night3775@gmail.com">
        <button onclick="testEmail()">Send Test Email</button>
        <div id="result"></div>
    </div>

    <script>
        async function testEmail() {
            const email = document.getElementById("email").value
            const resultDiv = document.getElementById("result")
            const button = document.querySelector("button")

            button.disabled = true
            button.textContent = "Sending..."

            try {
                const res = await fetch("/api/test-email", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email })
                })

                const data = await res.json()

                resultDiv.style.display = "block"

                if (res.ok) {
                    resultDiv.className = "success"
                    resultDiv.innerHTML = "✅ " + data.message
                } else {
                    resultDiv.className = "error"
                    resultDiv.innerHTML = "❌ Error: " + (data.details || data.error)
                }
            } catch (err) {
                resultDiv.style.display = "block"
                resultDiv.className = "error"
                resultDiv.innerHTML = "❌ Connection error"
            } finally {
                button.disabled = false
                button.textContent = "Send Test Email"
            }
        }
    </script>
</body>

</html>
