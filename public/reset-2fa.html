<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="csrf-token" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset 2FA</title>

    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .box {
            background: #1e293b;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        img {
            margin-top: 20px;
            max-width: 250px;
            border-radius: 8px;
            display: none;
            margin: 20px auto;
        }

        #error {
            color: #ef4444;
            margin-top: 15px;
            font-size: 14px;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #6366f1;
            text-decoration: none;
            font-size: 14px;
            padding: 10px 20px;
            border: 1px solid #6366f1;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            background: #6366f1;
            color: white;
            text-decoration: none;
        }

        .loading {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #6366f1;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .message {
            color: #10b981;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>

</head>

<body>

    <div class="box">

        <h2>New QR Code</h2>

        <p>Scan with Google Authenticator</p>

        <div class="loading" id="loading"></div>

        <img id="qr" alt="QR Code">

        <p id="error"></p>
        <p id="message" class="message"></p>

        <a href="/admin/dashboard.html" class="back-link">← Back to Login</a>

    </div>
    <script src="/reset-2fa.js"></script>
</body>

</html>
