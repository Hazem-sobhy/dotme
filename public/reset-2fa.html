<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="csrf-token" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset 2FA</title>

    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .box {
            background: #1e293b;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        h2 {
            color: #6366f1;
            margin-bottom: 10px;
        }

        p {
            color: #94a3b8;
            margin-bottom: 20px;
        }

        img {
            margin-top: 20px;
            max-width: 250px;
            border-radius: 8px;
            display: none;
            margin: 20px auto;
            border: 2px solid #6366f1;
        }

        #error {
            color: #ef4444;
            margin-top: 15px;
            font-size: 14px;
        }

        #message {
            color: #10b981;
            margin-top: 15px;
            font-size: 14px;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #6366f1;
            text-decoration: none;
            font-size: 14px;
            padding: 10px 20px;
            border: 1px solid #6366f1;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            background: #6366f1;
            color: white;
            text-decoration: none;
        }

        .loading {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #6366f1;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .debug {
            font-size: 10px;
            color: #4b5563;
            margin-top: 20px;
            text-align: left;
        }
    </style>

</head>

<body>

    <div class="box">

        <h2>Reset Two-Factor Authentication</h2>

        <p>Generate a new QR code for Google Authenticator</p>

        <div class="loading" id="loading"></div>

        <img id="qr" alt="QR Code">

        <p id="error"></p>
        <p id="message" class="message"></p>

        <a href="/admin/dashboard.html" class="back-link">← Back to Dashboard</a>

        <!-- للتصحيح فقط (حذف بعد التأكد من الشغل) -->
        <div class="debug" id="debug"></div>

    </div>
    <script src="/reset-2fa.js"></script>
</body>

</html>
